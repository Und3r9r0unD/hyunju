<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>2026 회계·재경 기출 O·X 퀴즈</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #182230;
    --muted: #5e6c84;
    --border: #dfe5f0;
    --primary: #2563eb;
    --primary-soft: #eff6ff;
    --o-color: #059669;
    --o-soft: #ecfdf5;
    --x-color: #dc2626;
    --x-soft: #fef2f2;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    touch-action: manipulation;
  }
  .hidden { display: none !important; }
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .center-wrap {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .gate-card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
  }
  .gate-card h1 {
    margin: 0 0 6px;
    font-size: 1.35rem;
    font-weight: 800;
  }
  .gate-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 20px;
  }
  .pw-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 1rem;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
  }
  .pw-input:focus { border-color: var(--primary); }
  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 16px;
    cursor: pointer;
  }
  .primary-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.6; cursor: default; }
  .err-msg {
    margin-top: 10px;
    font-size: 0.86rem;
    color: var(--x-color);
    font-weight: 600;
    min-height: 20px;
  }

  .level-grid {
    display: grid;
    gap: 12px;
    margin-top: 8px;
  }
  .level-btn {
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .level-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
  .level-btn:disabled { opacity: 0.6; cursor: wait; }
  .level-title { font-size: 1.08rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .level-desc { font-size: 0.84rem; color: var(--muted); }
  .level-tree-row {
    display: flex;
    justify-content: flex-end;
    margin-top: -4px;
  }
  .level-sub-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 13px;
    font-size: 0.84rem;
    font-weight: 700;
    color: #334155;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .level-sub-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary);
  }
  .level-sub-btn:disabled { opacity: 0.6; cursor: wait; }
  .tree-branch { color: var(--muted); font-weight: 400; }
  .lock-link {
    margin-top: 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.84rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .back-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .subtitle { font-size: 0.84rem; color: var(--muted); }
  .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .stat-pill span { color: var(--primary); }

  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 10px;
  }
  .ctrl-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .ctrl-group select, .ctrl-group button {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 0.88rem;
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
  }
  .ctrl-group button.secondary { background: #f8fafc; font-weight: 600; }

  .progress-wrap {
    background: var(--border);
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.25s ease;
  }

  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
  }
  .badge.subj { background: #f3e8ff; color: #7e22ce; }
  .badge.mode { background: #f1f5f9; color: #475569; }
  .badge.freq { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .bookmark-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--muted);
  }
  .bookmark-btn.active {
    background: #fef3c7;
    border-color: #f59e0b;
    color: #b45309;
    font-weight: 700;
  }

  .context-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 0.92rem;
    color: #334155;
  }
  .context-box p { margin: 0 0 6px; }
  .context-box p:last-child { margin-bottom: 0; }
  .context-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 0.84rem;
    background: #fff;
  }
  .context-table td { border: 1px solid var(--border); padding: 6px 8px; }
  .context-table tr:first-child td { background: #f1f5f9; font-weight: 700; }
  .topic-hint {
    display: inline-block;
    font-size: 0.95rem;
    font-weight: 700;
    color: #334155;
    background: #f1f5f9;
    padding: 5px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .statement-text {
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.65;
    margin: 8px 0 22px;
    word-break: keep-all;
  }
  .candidate-label {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-soft);
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  .ox-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ox-btn {
    border: 2px solid var(--border);
    background: #fff;
    border-radius: 14px;
    padding: 18px 12px;
    font-size: 1.8rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-family: inherit;
  }
  .ox-btn small { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
  .ox-btn.o-btn { color: var(--o-color); }
  .ox-btn.x-btn { color: var(--x-color); }
  .ox-btn:disabled { cursor: default; opacity: 0.75; }
  .ox-btn.chosen-correct { background: var(--o-soft); border-color: var(--o-color); opacity: 1; }
  .ox-btn.chosen-wrong { background: var(--x-soft); border-color: var(--x-color); opacity: 1; }

  .feedback { margin-top: 18px; border-radius: 12px; padding: 14px 16px; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--o-soft); border: 1px solid #a7f3d0; }
  .feedback.wrong { background: var(--x-soft); border: 1px solid #fecaca; }
  .feedback-title { font-weight: 800; font-size: 1rem; margin-bottom: 6px; }
  .feedback.correct .feedback-title { color: var(--o-color); }
  .feedback.wrong .feedback-title { color: var(--x-color); }
  .orig-box {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(0,0,0,0.12);
    font-size: 0.86rem;
    color: #334155;
  }
  .orig-choices { list-style: none; padding: 0; margin: 6px 0 0; }
  .orig-choices li { padding: 3px 6px; border-radius: 6px; margin-bottom: 3px; }
  .orig-choices li.ans-item { background: rgba(37, 99, 235, 0.1); font-weight: 700; }
  .exp-box {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(0, 0, 0, 0.08);
    font-size: 0.88rem;
    line-height: 1.6;
    color: #1e293b;
  }
  .exp-box b { color: #0f172a; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  .nav-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .kbd-hint { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>

<!-- 1. Password Gate -->
<div id="screen-login" class="center-wrap">
  <div class="gate-card">
    <h1>회계·재경 기출 O·X 퀴즈</h1>
    <div class="gate-sub">암호를 입력하면 선택한 시험 데이터를 불러옵니다.</div>
    <form id="login-form">
      <input id="pw-input" class="pw-input" type="password" placeholder="접근 암호 입력" autocomplete="current-password" required />
      <label class="remember-row">
        <input id="chk-remember" type="checkbox" checked />
        <span>이 기기에서 로그인 유지</span>
      </label>
      <button id="btn-unlock" class="primary-btn" type="submit">입장하기</button>
      <div id="login-err" class="err-msg"></div>
    </form>
  </div>
</div>

<!-- 2. Exam Select -->
<div id="screen-select" class="center-wrap hidden">
  <div class="gate-card">
    <h1>시험을 선택하세요</h1>
    <div class="gate-sub">2026년 1·3·5·6·7·9월 기출문제 + 확정답안</div>
    <div class="level-grid">
      <button class="level-btn" id="pick-l1" type="button">
        <div class="level-title">📘 회계관리 1급</div>
        <div class="level-desc">재무회계 · 세무회계 (총 480문항 · 해설 포함)</div>
      </button>
      <div class="level-tree-row">
        <button class="level-sub-btn" id="pick-l1-notes" type="button">
          <span class="tree-branch">└</span>
          <span>📝 회계관리 1급 핵심암기노트 (이론 87 · 계산 35)</span>
        </button>
      </div>
      <button class="level-btn" id="pick-l2" type="button">
        <div class="level-title">📗 회계관리 2급</div>
        <div class="level-desc">회계원리 (총 240문항 · 해설 포함)</div>
      </button>
      <div class="level-tree-row">
        <button class="level-sub-btn" id="pick-l2-notes" type="button">
          <span class="tree-branch">└</span>
          <span>📝 회계관리 2급 핵심암기노트 (이론 12 · 계산 17)</span>
        </button>
      </div>
      <button class="level-btn" id="pick-jk" type="button">
        <div class="level-title">📙 재경관리사</div>
        <div class="level-desc">재무 · 세무 · 원가관리회계 (총 720문항 · 해설 포함)</div>
      </button>
      <div class="level-tree-row">
        <button class="level-sub-btn" id="pick-jk-notes" type="button">
          <span class="tree-branch">└</span>
          <span>📝 재경관리사 핵심암기노트 (이론 161 · 계산 51)</span>
        </button>
      </div>
    </div>
    <div id="select-err" class="err-msg"></div>
    <button id="btn-lock" class="lock-link" type="button">로그아웃 (암호 잠금)</button>
  </div>
</div>

<!-- 3. Quiz App -->
<div id="screen-quiz" class="container hidden">
  <header>
    <div class="header-left">
      <button id="btn-back-level" class="back-btn" type="button">← 시험 선택</button>
      <div>
        <h1 id="quiz-title">O·X 퀴즈</h1>
        <div id="quiz-subtitle" class="subtitle"></div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-pill">진행 <span id="stat-progress">0/0</span></div>
      <div class="stat-pill">정답률 <span id="stat-acc">-</span></div>
      <div class="stat-pill">연속 <span id="stat-streak">0</span></div>
      <div class="stat-pill">오답 <span id="stat-wrong">0</span></div>
    </div>
  </header>

  <section class="controls">
    <div class="ctrl-group">
      <label for="sel-month">시험 회차</label>
      <select id="sel-month">
        <option value="ALL">전체 회차 (1·3·5·6·7·9월)</option>
        <option value="1월">2026년 1월</option>
        <option value="3월">2026년 3월</option>
        <option value="5월">2026년 5월</option>
        <option value="6월">2026년 6월</option>
        <option value="7월">2026년 7월</option>
        <option value="9월">2026년 9월</option>
      </select>
    </div>
    <div class="ctrl-group" id="subj-group">
      <label for="sel-subject">과목</label>
      <select id="sel-subject"></select>
    </div>
    <div class="ctrl-group">
      <label for="sel-mode">퀴즈 유형</label>
      <select id="sel-mode">
        <option value="statement">이론 지문 O·X (순수 서술형)</option>
        <option value="all">전체 문항 O·X (계산·단답 포함)</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label for="sel-order">출제 방식</label>
      <select id="sel-order">
        <option value="balance">⚖️ O·X 50:50 (문항당 1지문 · 추천)</option>
        <option value="shuffle">전체 선지 풀기 (30문제 간격 분산)</option>
        <option value="seq">기출 순서대로</option>
        <option value="freq_desc">🔥 자주등장만 (중복제거 · 빈도순)</option>
        <option value="freq_rand">🔥 자주등장만 (중복제거 · 랜덤)</option>
        <option value="wrong">오답노트만 풀기</option>
        <option value="bookmark">북마크(★)만 풀기</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>&nbsp;</label>
      <button id="btn-reset" class="secondary" type="button">기록 초기화</button>
    </div>
  </section>

  <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
  <main id="quiz-area" class="quiz-card"></main>
  <div class="kbd-hint">단축키: <b>O</b> / <b>←</b> = O &nbsp;|&nbsp; <b>X</b> / <b>→</b> = X &nbsp;|&nbsp; <b>Space</b> / <b>Enter</b> = 다음 문제</div>
</div>

<!-- 4. Notes App -->
<div id="screen-notes" class="container hidden">
  <header>
    <div class="header-left">
      <button id="btn-back-notes" class="back-btn" type="button">← 시험 선택</button>
      <div>
        <h1 id="notes-title">핵심암기노트</h1>
        <div id="notes-subtitle" class="subtitle"></div>
      </div>
    </div>
    <button class="back-btn" onclick="window.print()" type="button">🖨️ 인쇄 / PDF</button>
  </header>

  <section class="controls">
    <div class="ctrl-group">
      <label for="notes-search">키워드 검색</label>
      <input id="notes-search" type="search" placeholder="예: 이연법인세, IRR" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:0.88rem;font-family:inherit;" />
    </div>
    <div class="ctrl-group">
      <label for="notes-subj">과목</label>
      <select id="notes-subj">
        <option value="ALL">전체 과목</option>
        <option value="재무회계">재무회계</option>
        <option value="세무회계">세무회계</option>
        <option value="원가관리회계">원가관리회계</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label for="notes-ox">O / X 구분</label>
      <select id="notes-ox">
        <option value="ALL">O / X 전체</option>
        <option value="O">O (옳은 지문만)</option>
        <option value="X">X (함정·오답 지문만)</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label for="notes-freq">출제 빈도</label>
      <select id="notes-freq">
        <option value="2">2회 이상 출제</option>
        <option value="3">3회 이상 초빈출</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label for="notes-mem">암기 여부</label>
      <select id="notes-mem">
        <option value="ALL">전체 보기</option>
        <option value="TODO">미암기만</option>
      </select>
    </div>
  </section>

  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
    <button class="back-btn" id="notes-tab-stmt" type="button" style="background:var(--primary);color:#fff;border-color:var(--primary);">📌 핵심 이론 O·X (161)</button>
    <button class="back-btn" id="notes-tab-calc" type="button">🧮 핵심 계산·사례 (51)</button>
  </div>
  <div id="notes-count" class="subtitle" style="margin-bottom:10px;"></div>
  <main id="notes-list"></main>
</div>

<script>
const PW_STORAGE_KEY = "hoegye_portal_pw_v1";
const CIRCLED = ["①", "②", "③", "④"];

const EXAM_META = {
  l1: {
    file: "data/l1.enc",
    title: "회계관리 1급 O·X 퀴즈",

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function fetchAndDecrypt(url, password) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error("HTTPS 또는 localhost 환경에서 열어주세요 (WebCrypto 필요).");
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`데이터를 불러오지 못했습니다 (${res.status})`);
  const bundle = await res.json();
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const aesKey = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: b64ToBytes(bundle.salt),
      iterations: bundle.iter,
      hash: "SHA-256",
    },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plainBuf = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(bundle.iv) },
    aesKey,
    b64ToBytes(bundle.ct)
  );
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

async function tryUnlock(password, remember) {
  const btn = document.getElementById("btn-unlock");
  const errEl = document.getElementById("login-err");
  btn.disabled = true;
  btn.textContent = "확인 중...";
  errEl.textContent = "";
  try {
    await fetchAndDecrypt("data/auth.enc", password);
    activePassword = password;
    if (remember) {
      try { localStorage.setItem(PW_STORAGE_KEY, password); } catch (e) {}
    }
    showScreen("select");
  } catch (e) {
    try { localStorage.removeItem(PW_STORAGE_KEY); } catch (_) {}
    errEl.textContent = e.message && (e.message.includes("HTTPS") || e.message.includes("불러오지"))
      ? e.message
      : "암호가 올바르지 않습니다.";
  } finally {
    btn.disabled = false;
    btn.textContent = "입장하기";
  }
}

          <div class="exp-box" style="margin-top:0;"><b>💡 해설:</b> ${escapeHtml(it.exp)}</div>

      <article class="quiz-card" style="margin-bottom:12px;padding:16px 18px;${done ? "opacity:0.55;" : ""}">

          <div class="badges">

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderStemHtml(stem) {
  const lines = stem.split("\n");
  let html = "";
  let tableRows = [];
  const flushTable = () => {
    if (!tableRows.length) return;
    html += '<table class="context-table">';
    for (const row of tableRows) {
      const cells = row.split(" | ");
      html += "<tr>" + cells.map(c => `<td>${escapeHtml(c.trim())}</td>`).join("") + "</tr>";
    }
    html += "</table>";
    tableRows = [];
  };
  for (const ln of lines) {
    if (ln.includes(" | ")) tableRows.push(ln);
    else { flushTable(); html += `<p>${escapeHtml(ln)}</p>`; }
  }
  flushTable();
  return html;
}

function buildDeck() {
  const month = document.getElementById("sel-month").value;
  const subj = document.getElementById("sel-subject").value;
  const mode = document.getElementById("sel-mode").value;
  const order = document.getElementById("sel-order").value;
  const wrongSet = new Set(saved.wrongIds);
  const bmSet = new Set(saved.bookmarks);

  const items = [];
  for (const q of QUIZ_DATA) {
    if (month !== "ALL" && q.month !== month) continue;
    if (subj !== "ALL" && q.subject !== subj) continue;
    if (mode === "statement" && q.type !== "statement") continue;

    if (q.type === "statement") {
      for (let c = 0; c < 4; c++) {
        const cardId = `${q.id}-c${c + 1}`;
        const isAns = q.answers.includes(c + 1);
        const isTrue = (q.polarity === "pos") ? isAns : !isAns;
        items.push({
          cardId, q, choiceIdx: c, statement: q.choices[c], isTrue, isChoiceVerify: false,
          freq: (q.choiceFreq && q.choiceFreq[c]) ? q.choiceFreq[c] : { count: 1, months: [q.month], rep: true },
        });
      }
    } else {
      const pickCorrect = Math.random() < 0.5;
      const wrongs = [0, 1, 2, 3].filter(x => !q.answers.includes(x + 1));
      let c = (pickCorrect || !wrongs.length)
        ? (q.answers[Math.floor(Math.random() * q.answers.length)] - 1)
        : wrongs[Math.floor(Math.random() * wrongs.length)];
      items.push({
        cardId: `${q.id}-v`, q, choiceIdx: c, statement: q.choices[c],
        isTrue: q.answers.includes(c + 1), isChoiceVerify: true,
        freq: q.stemFreq || { count: 1, months: [q.month], rep: true },
      });
    }
  }

  const shuffleArr = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  const spreadByQuestion = (arr) => {
    const res = [];
    const pool = [...arr];
    const recent = [];
    while (pool.length) {
      let pickIdx = pool.findIndex(it => !recent.includes(it.q.id));
      if (pickIdx < 0) pickIdx = 0;
      const [picked] = pool.splice(pickIdx, 1);
      res.push(picked);
      recent.push(picked.q.id);
      if (recent.length > 30) recent.shift();
    }
    return res;
  };

  let filtered = items;
  if (order === "balance") {
    const byQ = new Map();
    for (const it of items) {
      if (!byQ.has(it.q.id)) byQ.set(it.q.id, []);
      byQ.get(it.q.id).push(it);
    }
    const groups = shuffleArr(Array.from(byQ.values()));
    const picked = [];
    let oCount = 0, xCount = 0;
    for (const grp of groups) {
      const oChoices = grp.filter(it => it.isTrue);
      const xChoices = grp.filter(it => !it.isTrue);
      let pool = (oCount <= xCount) ? oChoices : xChoices;
      if (!pool.length) pool = grp;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      picked.push(chosen);
      if (chosen.isTrue) oCount++;
      else xCount++;
    }
    filtered = shuffleArr(picked);
  } else if (order === "wrong") {
    filtered = items.filter(it => wrongSet.has(it.cardId));
  } else if (order === "bookmark") {
    filtered = items.filter(it => bmSet.has(it.cardId));
  } else if (order === "freq_desc" || order === "freq_rand") {
    filtered = items.filter(it => it.freq.count >= 2 && it.freq.rep !== false);
  }

  if (order === "freq_desc") {
    filtered.sort((a, b) => b.freq.count - a.freq.count || a.q.id.localeCompare(b.q.id));
  } else if (order === "shuffle") {
    filtered = spreadByQuestion(shuffleArr(filtered));
  } else if (order === "freq_rand") {
    shuffleArr(filtered);
  }

  deck = filtered;
  idx = 0;
  answeredCurrent = false;
  updateStats();
  renderCard();
}

function updateStats() {
  document.getElementById("stat-progress").textContent = deck.length ? `${Math.min(idx + 1, deck.length)}/${deck.length}` : "0/0";
  document.getElementById("stat-acc").textContent = sessionSolved ? `${Math.round((sessionCorrect / sessionSolved) * 100)}%` : "-";
  document.getElementById("stat-streak").textContent = String(streak);
  document.getElementById("stat-wrong").textContent = String(saved.wrongIds.length);
  const pct = deck.length ? ((idx + (answeredCurrent ? 1 : 0)) / deck.length) * 100 : 0;
  document.getElementById("progress-fill").style.width = `${Math.min(100, pct)}%`;
}

function renderCard() {
  const area = document.getElementById("quiz-area");
  if (!deck.length) {
    area.innerHTML = `<div class="empty-state">조건에 해당하는 문제가 없습니다.<br><small>필터나 출제 방식을 변경해 보세요.</small></div>`;
    return;
  }
  const item = deck[idx];
  const { q, statement, isChoiceVerify, cardId, freq } = item;
  const isBm = saved.bookmarks.includes(cardId);
  const freqBadge = (freq && freq.count >= 2)
    ? `<span class="badge freq">🔥 자주등장 ${freq.count}회 (${freq.months.join("·")})</span>` : "";

  let contextHtml = "";
  if (isChoiceVerify || !q.simpleStem) {
    contextHtml = `<div class="context-box">${renderStemHtml(q.stem)}</div>`;
  } else {
    const cleanTopic = q.stem
      .replace(/^다음\s*(중)?\s*/, "")
      .replace(/\s*(에|과|와)?\s*(관한|대한)\s*설명으로.*$/, "")
      .replace(/\s*(옳은|옳지 않은|틀린|잘못된|적절한|적절하지 않은|올바른|올바르지 않은)\s*것은.*$/, "")
      .trim();
    contextHtml = `<div class="topic-hint">📌 주제: ${escapeHtml(cleanTopic)} (맞으면 O, 틀리면 X)</div>`;
  }

  area.innerHTML = `
    <div class="card-top">
      <div class="badges">
        <span class="badge">2026년 ${q.month} · ${q.num}번</span>
        <span class="badge subj">${q.subject}</span>
        <span class="badge mode">${isChoiceVerify ? "계산·단답 O/X" : "이론 지문 O/X"}</span>
        ${freqBadge}
      </div>
      <button class="bookmark-btn ${isBm ? "active" : ""}" id="btn-bm" type="button">${isBm ? "★ 북마크됨" : "☆ 북마크"}</button>
    </div>
    ${contextHtml}
    ${isChoiceVerify ? `<div class="candidate-label">제시된 보기가 정답인가요?</div>` : ""}
    <div class="statement-text">${escapeHtml(statement)}</div>
    <div class="ox-buttons">
      <button class="ox-btn o-btn" id="btn-o" type="button">O<small>옳다 (맞음)</small></button>
      <button class="ox-btn x-btn" id="btn-x" type="button">X<small>틀리다 (아님)</small></button>
    </div>
    <div class="feedback" id="feedback-box"></div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" type="button" ${idx === 0 ? "disabled" : ""}>← 이전</button>
      <button class="nav-btn primary" id="btn-next" type="button">${idx < deck.length - 1 ? "다음 문제 →" : "처음으로"}</button>
    </div>
  `;

  answeredCurrent = false;
  document.getElementById("btn-o").onclick = () => submitAnswer(true);
  document.getElementById("btn-x").onclick = () => submitAnswer(false);
  document.getElementById("btn-bm").onclick = () => toggleBookmark(cardId);
  document.getElementById("btn-prev").onclick = () => { if (idx > 0) { idx--; renderCard(); updateStats(); } };
  document.getElementById("btn-next").onclick = nextCard;
}

function toggleBookmark(cardId) {
  const pos = saved.bookmarks.indexOf(cardId);
  if (pos >= 0) saved.bookmarks.splice(pos, 1);
  else saved.bookmarks.push(cardId);
  saveState();
  const btn = document.getElementById("btn-bm");
  const active = saved.bookmarks.includes(cardId);
  btn.classList.toggle("active", active);
  btn.textContent = active ? "★ 북마크됨" : "☆ 북마크";
}

function submitAnswer(userGuess) {
  if (answeredCurrent) return;
  answeredCurrent = true;
  const item = deck[idx];
  const correct = (userGuess === item.isTrue);

  sessionSolved++;
  if (correct) {
    sessionCorrect++;
    streak++;
    const wIdx = saved.wrongIds.indexOf(item.cardId);
    if (wIdx >= 0) saved.wrongIds.splice(wIdx, 1);
  } else {
    streak = 0;
    if (!saved.wrongIds.includes(item.cardId)) saved.wrongIds.push(item.cardId);
  }
  saveState();

  const btnO = document.getElementById("btn-o");
  const btnX = document.getElementById("btn-x");
  btnO.disabled = true;
  btnX.disabled = true;
  (userGuess ? btnO : btnX).classList.add(correct ? "chosen-correct" : "chosen-wrong");

  const fb = document.getElementById("feedback-box");
  fb.className = `feedback show ${correct ? "correct" : "wrong"}`;
  const q = item.q;
  const origList = q.choices.map((ch, i) => {
    const isAns = q.answers.includes(i + 1);
    let oxTag = "";
    if (q.type === "statement") {
      const stmtTrue = (q.polarity === "pos") ? isAns : !isAns;
      oxTag = ` <b>[${stmtTrue ? "O" : "X"}]</b>`;
    } else if (isAns) {
      oxTag = ` <b>[확정답안]</b>`;
    }
    return `<li class="${isAns ? "ans-item" : ""}">${CIRCLED[i]} ${escapeHtml(ch)}${oxTag}</li>`;
  }).join("");

  const expHtml = q.exp
    ? `<div class="exp-box"><b>💡 해설</b><div style="margin-top:4px;">${escapeHtml(q.exp)}</div></div>`
    : "";

  fb.innerHTML = `
    <div class="feedback-title">${correct ? "정답입니다!" : "오답입니다."} (정답: ${item.isTrue ? "O (옳음)" : "X (틀림)"})</div>
    <div class="orig-box">
      <div><b>원문 기출</b> (2026년 ${q.month} ${q.subject} ${q.num}번 · 확정답안 ${q.answers.map(a => CIRCLED[a - 1]).join(", ")})</div>
      <div style="margin-top:4px;">${escapeHtml(q.stem.replace(/\n/g, " "))}</div>
      <ul class="orig-choices">${origList}</ul>
      ${expHtml}
    </div>
  `;
  updateStats();
}

function nextCard() {
  if (!deck.length) return;
  idx = (idx < deck.length - 1) ? idx + 1 : 0;
  renderCard();
  updateStats();
}

document.getElementById("sel-month").onchange = buildDeck;
document.getElementById("sel-subject").onchange = buildDeck;
document.getElementById("sel-mode").onchange = buildDeck;
document.getElementById("sel-order").onchange = buildDeck;
document.getElementById("btn-reset").onclick = () => {
  if (!confirm("현재 시험의 오답노트와 북마크, 점수를 초기화할까요?")) return;
  saved = { wrongIds: [], bookmarks: [] };
  saveState();
  sessionSolved = 0;
  sessionCorrect = 0;
  streak = 0;
  buildDeck();
};

document.addEventListener("keydown", (e) => {
  if (document.getElementById("screen-quiz").classList.contains("hidden")) return;
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "o" || k === "1" || e.key === "ArrowLeft") submitAnswer(true);
  else if (k === "x" || k === "2" || e.key === "ArrowRight") submitAnswer(false);
  else if ((e.key === " " || e.key === "Enter") && answeredCurrent) { e.preventDefault(); nextCard(); }
});

(function init() {
  try {
    const savedPw = localStorage.getItem(PW_STORAGE_KEY);
    if (savedPw) {
      tryUnlock(savedPw, true);
      return;
    }
  } catch (e) {}
  showScreen("login");
})();
</script>
</body>
</html>
